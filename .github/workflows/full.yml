name: full (manual, with Sidon)

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAKE_NORMAL_VOICE_HOME: ${{ github.workspace }}/.mnv-home
      VR_FULL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: cache all core models (Sidon ~1 GB)
        uses: actions/cache@v4
        with:
          path: .mnv-home/models
          key: models-core-${{ hashFiles('skills/make-normal-voice/src/make_normal_voice/install.py') }}
      - run: skills/make-normal-voice/scripts/make-normal-voice install --yes --skip-ffmpeg
      - run: skills/make-normal-voice/scripts/make-normal-voice doctor
      - name: all tests including the real-model ones
        run: uv run --project skills/make-normal-voice --group dev pytest -q tests
      - name: end-to-end on an open clip
        run: |
          skills/make-normal-voice/scripts/make-normal-voice process tests/fixtures/speaker_a.flac --out e2e --language en
          cat e2e/report.md
