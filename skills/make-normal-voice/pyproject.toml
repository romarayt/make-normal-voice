[project]
name = "make-normal-voice"
version = "0.2.0"
description = "Turn any speech recording into a clean, close-mic podcast-style voice track, locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Roma Rayt" }]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.13",
    "soxr>=0.5",
    "platformdirs>=4.3",
    "torch>=2.8",
    "transformers>=4.56",
    "gammatone>=1.0.3",
    "onnxruntime>=1.22",
    "faster-whisper>=1.2",
    "matplotlib>=3.9",
]

[project.scripts]
make-normal-voice = "make_normal_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12"]
eval = ["pesq>=0.0.4", "pystoi>=0.4", "torchmetrics>=1.8", "torchaudio>=2.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make_normal_voice"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
extend = "../../ruff.toml"
